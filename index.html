<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tracker de escalada de 4 semanas para plan, logs, video y objetivos."
    />
    <title>Escalada 4W Tracker</title>
    <link rel="icon" href="%BASE_URL%assets/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("climb4w.theme") === "light" ? "light" : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
