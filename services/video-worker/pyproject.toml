[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climb-video-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "supabase>=2.13,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/climb_video"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["climb_video"]

