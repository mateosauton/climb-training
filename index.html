<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Maillon guarda tu plan de escalada, tus sesiones y tus objetivos."
    />
    <meta name="application-name" content="Maillon" />
    <meta property="og:title" content="Maillon" />
    <meta
      property="og:description"
      content="Maillon guarda tu plan de escalada, tus sesiones y tus objetivos."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es" />
    <title>Maillon</title>
    <link rel="icon" href="%BASE_URL%assets/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("climb4w.theme") === "light" ? "light" : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
