name: climb-video-intelligence

services:
  vllm:
    image: vllm/vllm-openai:v0.14.1
    command:
      - --model=Qwen/Qwen3-VL-8B-Instruct
      - --dtype=bfloat16
      - --max-model-len=32768
      - --gpu-memory-utilization=0.85
      - --max-num-seqs=2
      - --host=0.0.0.0
      - --port=8000
    expose:
      - "8000"
    ipc: host
    shm_size: 16gb
    volumes:
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 15m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks: [model, egress]

  worker:
    build:
      context: ../..
      dockerfile: services/video-worker/Dockerfile
    env_file:
      - /etc/climb-video-worker/worker.env
    environment:
      QWEN_BASE_URL: http://vllm:8000
      QWEN_MODEL: Qwen/Qwen3-VL-8B-Instruct
    depends_on:
      vllm:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=8g,mode=1770
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks: [model, egress]

networks:
  model:
    internal: true
  egress:

volumes:
  model-cache:
